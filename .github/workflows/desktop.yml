name: Desktop

# Builds the Electron desktop app (apps/desktop) on macOS and Windows runners.
# Pull requests and main produce UNSIGNED artifacts (no secrets needed).
# Signed / notarized release builds: run manually with `sign: true` once the
# signing secrets listed in docs/desktop.md are configured on the repository.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      sign:
        description: Sign (and notarize on macOS) with repository secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            target: --mac
            artifacts: |
              apps/desktop/dist/release/*.dmg
              apps/desktop/dist/release/*.zip
              apps/desktop/dist/release/latest-mac.yml
          - name: Windows
            os: windows-2022
            target: --win
            artifacts: |
              apps/desktop/dist/release/*.exe
              apps/desktop/dist/release/*.blockmap
              apps/desktop/dist/release/latest.yml
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # pnpm may skip Electron's postinstall when the store already has the
      # package; make sure the binary is there (no-op when it is).
      - name: Ensure Electron binary
        run: node apps/desktop/node_modules/electron/install.js

      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm --filter sipkit-desktop typecheck
      - run: pnpm --filter sipkit-desktop test
      - run: pnpm --filter sipkit-desktop build

      - name: Electron e2e (mock engine)
        run: pnpm --filter sipkit-desktop test:e2e
        env:
          CI: "true"

      - name: Package (unsigned)
        if: ${{ !inputs.sign }}
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SIPKIT_UPDATE_URL: ${{ vars.SIPKIT_UPDATE_URL }}

      # electron-builder wants a path to the App Store Connect .p8 key.
      - name: Write notarization key
        if: ${{ inputs.sign && runner.os == 'macOS' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Package (signed)
        if: ${{ inputs.sign }}
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
        env:
          SIPKIT_UPDATE_URL: ${{ vars.SIPKIT_UPDATE_URL }}
          # macOS: Developer ID Application certificate (.p12, base64) + password.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          # macOS notarization (App Store Connect API key or Apple ID).
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: Authenticode certificate (.pfx, base64) + password.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-${{ matrix.name }}
          path: |
            apps/desktop/test-results
          retention-days: 7
          if-no-files-found: ignore
