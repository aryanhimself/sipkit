; Dev dialplan
;   600       echo test (echoes audio and video; Echo() requests a keyframe for video)
;   601       music on hold (60 s)
;   602       speaking clock-ish: plays a prompt, then hangs up (early media test via Progress)
;   700       queue "support" (ringall 1001,1002)
;   *97       voicemail main menu for the caller's own mailbox (no PIN)
;   8XXXX     leave a voicemail in mailbox XXXX (e.g. 81002)
;   *99XXXX   DEV ONLY: delete every message in mailbox XXXX (e2e reset)
;   6000      echo test behind a Local channel: a bridged party that can be transferred
;             (600 runs Echo() on the caller's own channel, so it cannot be moved anywhere)
;   *78 / *79 server-side DND on / off for the calling endpoint (astdb DND/<ext> + Custom:DND<ext>)
;   *76       DND state query: 486 Busy when DND is on, answered (200) when off
;   7XXXX     ConfBridge room XXXX (e.g. 71001 = room of 1001), see confbridge.conf
;   1XXX      WebRTC users (486 Busy while server-side DND is on). With the push service
;             configured (SIPKIT_PUSH_URL), an offline 1XXX gets a Web Push notification and
;             the call keeps ringing until the agent opens the tab (docs/push.md)
;   2XXX      plain SIP users (486 Busy while server-side DND is on)
;   **XXXX    directed call pickup: answer the call ringing at extension XXXX (BLF pickup)
;   *85<id>   rejoin reload-safe call anchor <id>; *86<id> end it (docs/resume.md)
; BLF / presence (docs/presence.md): every 1XXX / 2XXX extension has a dynamic
; pattern hint, so SUBSCRIBE (dialog or presence) to e.g. 1001 reports PJSIP/1001.
; [messages]   SIP MESSAGE (chat) routing for 1XXX / 2XXX, see below
[general]
static=yes
writeprotect=yes

[from-internal]
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

exten => 601,1,NoOp(Music on hold test)
 same => n,Answer()
 same => n,MusicOnHold(default,60)
 same => n,Hangup()

; Sends 183 Session Progress with audio before answering (exercises earlyMedia).
exten => 602,1,NoOp(Early media test)
 same => n,Progress()
 same => n,Playback(tt-monkeys,noanswer)
 same => n,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

exten => 700,1,NoOp(Queue example)
 same => n,Answer()
 same => n,Queue(support,t,,,120)
 same => n,Hangup()

; ---------------------------------------------------------------- voicemail
exten => *97,1,NoOp(Voicemail for ${CALLERID(num)})
 same => n,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()

; Greeting + beep, then records until the caller hangs up (minsecs=0 keeps short messages).
exten => _8XXXX,1,NoOp(Leave voicemail for ${EXTEN:1})
 same => n,Answer()
 same => n,VoiceMail(${EXTEN:1}@default,s)
 same => n,Hangup()

; pollmailboxes=yes (voicemail.conf) publishes the new MWI state within ~2 s.
exten => _*99XXXX,1,NoOp(Purge mailbox ${EXTEN:3})
 same => n,Answer()
 same => n,System(rm -f /var/spool/asterisk/voicemail/default/${EXTEN:3}/INBOX/* /var/spool/asterisk/voicemail/default/${EXTEN:3}/Old/* /var/spool/asterisk/voicemail/default/${EXTEN:3}/Urgent/*)
 same => n,Playback(beep)
 same => n,Hangup()

; Echo test as a real bridged party (Local channel), e.g. to move it into a ConfBridge room.
; The echo side hangs up after 2 minutes so a party left alone in a room does not linger.
exten => 6000,1,NoOp(Bridged echo test)
 same => n,Dial(Local/s@sipkit-echo-party/n,30)
 same => n,Hangup()

; ---------------------------------------------------------------- server-side DND (V2-FWD-01)
; The softphone dials these silently (config dnd.mode 'server' | 'both'). The state is
; written BEFORE Answer(), so a 200 OK means it is stored. Keyed by the PJSIP endpoint
; (cannot be spoofed with a From header, unlike CALLERID(num)).
exten => *78,1,NoOp(DND on for ${CHANNEL(endpoint)})
 same => n,Set(DB(DND/${CHANNEL(endpoint)})=1)
 same => n,Set(DEVICE_STATE(Custom:DND${CHANNEL(endpoint)})=BUSY)
 same => n,Answer()
 same => n,Hangup()

exten => *79,1,NoOp(DND off for ${CHANNEL(endpoint)})
 same => n,Set(DBDEL_RESULT=${DB_DELETE(DND/${CHANNEL(endpoint)})})
 same => n,Set(DEVICE_STATE(Custom:DND${CHANNEL(endpoint)})=NOT_INUSE)
 same => n,Answer()
 same => n,Hangup()

; Query (config dnd.serverQuery): busy = DND on, answered = DND off.
exten => *76,1,NoOp(DND state for ${CHANNEL(endpoint)})
 same => n,GotoIf($["${DB(DND/${CHANNEL(endpoint)})}" = "1"]?on)
 same => n,Answer()
 same => n,Hangup()
 same => n(on),Busy(1)

; ---------------------------------------------------------------- ConfBridge rooms (V2-CONF-01)
; 7 + room, e.g. 71001. The softphone (config conference.mode 'server') joins first with
; X-Sipkit-Conference: owner (marked admin, admin DTMF menu) and then REFERs every party here.
; X-Sipkit-Conference-End: yes on the owner's INVITE makes the room end when the owner leaves;
; otherwise the parties stay connected after the owner hangs up.
exten => _7XXXX,1,NoOp(ConfBridge room ${EXTEN:1})
 same => n,Set(ROOM=${EXTEN:1})
 same => n,GotoIf($["${PJSIP_HEADER(read,X-Sipkit-Conference)}" = "owner"]?owner)
 same => n,Answer()
 same => n,GotoIf($["${DB(CONF/${ROOM}/end)}" = "1"]?endmarked)
 same => n,ConfBridge(${ROOM},sipkit_bridge,sipkit_party)
 same => n,Hangup()
 same => n(endmarked),ConfBridge(${ROOM},sipkit_bridge,sipkit_party_end)
 same => n,Hangup()
 same => n(owner),Set(DB(CONF/${ROOM}/end)=${IF($["${PJSIP_HEADER(read,X-Sipkit-Conference-End)}" = "yes"]?1:0)})
 same => n,Answer()
 same => n,ConfBridge(${ROOM},sipkit_bridge,sipkit_owner,sipkit_owner_menu)
 same => n,Hangup()

; ---------------------------------------------------------------- reload-safe calls (V2-RESUME-01)
; docs/resume.md. *85<id> rejoins anchor room <id> after a page reload (only the agent
; who owns it, and only while the customer is still waiting); *86<id> ends it for good
; (the agent really hung up). Both are dialled silently by the softphone.
exten => _*85X.,1,NoOp(Rejoin anchor ${EXTEN:3} by ${CHANNEL(endpoint)})
 same => n,Set(ID=${FILTER(0-9,${EXTEN:3})})
 same => n,GotoIf($["${DB(ANCHOR/${ID}/agent)}" != "${CHANNEL(endpoint)}"]?gone)
 same => n,GotoIf($["${DB(ANCHOR/${ID}/ended)}" = "1"]?gone)
 same => n,Answer()
 same => n,Goto(sipkit-anchor-agent,${ID},1)
 same => n(gone),NoOp(Anchor ${ID} is gone)
 same => n,Hangup(1)

exten => _*86X.,1,NoOp(End anchor ${EXTEN:3} by ${CHANNEL(endpoint)})
 same => n,Set(ID=${FILTER(0-9,${EXTEN:3})})
 same => n,GotoIf($["${DB(ANCHOR/${ID}/agent)}" != "${CHANNEL(endpoint)}"]?gone)
 same => n,Set(DB(ANCHOR/${ID}/ended)=1)
 same => n,Set(PARTY=${DB(ANCHOR/${ID}/party)})
 same => n,ExecIf($["${PARTY}" != ""]?ChannelRedirect(${PARTY},sipkit-anchor-bye,s,1))
 same => n,Answer()
 same => n,Hangup()
 same => n(gone),Hangup(1)

; ---------------------------------------------------------------- BLF pickup
; PickupChan with the p(refix) option matches the ringing channel PJSIP/<ext>-xxxxxxxx.
exten => _**X.,1,NoOp(Directed pickup of ${EXTEN:2} by ${CALLERID(num)})
 same => n,PickupChan(PJSIP/${EXTEN:2}-,p)
 same => n,Playback(beeperr)
 same => n,Hangup()

exten => _1XXX,hint,PJSIP/${EXTEN}
exten => _1XXX,1,NoOp(Call to WebRTC user ${EXTEN})
 same => n,GotoIf($["${DB(DND/${EXTEN})}" = "1"]?dnd)
 same => n,Gosub(sipkit-push,start,1(${EXTEN}))
 same => n,GotoIf($["${PUSH_RESULT}" = "declined"]?busy)
 ; After the push wait, so a tab woken by a notification is anchored too (docs/resume.md).
 same => n,Gosub(sipkit-anchor,setup,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN},30,tTb(sipkit-push-header^s^1(${UNIQUEID}))${ANCHOR_OPTS})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Hangup()
 same => n(busy),Busy(5)
 same => n(dnd),NoOp(${EXTEN} is on Do Not Disturb)
 same => n,Busy(5)

exten => _2XXX,hint,PJSIP/${EXTEN}
exten => _2XXX,1,NoOp(Call to SIP user ${EXTEN})
 same => n,GotoIf($["${DB(DND/${EXTEN})}" = "1"]?dnd)
 same => n,Gosub(sipkit-anchor,setup,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN},30,tT${ANCHOR_OPTS})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Hangup()
 same => n(busy),Busy(5)
 same => n(dnd),NoOp(${EXTEN} is on Do Not Disturb)
 same => n,Busy(5)

exten => i,1,Playback(invalid)
 same => n,Hangup()

[sipkit-echo-party]
exten => s,1,Set(TIMEOUT(absolute)=120)
 same => n,Goto(from-internal,600,1)

; ---------------------------------------------------------------- chat (SIP MESSAGE)
; V2-CHAT-01. Endpoints set message_context=messages (pjsip.conf), so
; res_pjsip_messaging hands every out-of-dialog MESSAGE to this context:
;  - The To user must match an extension here, otherwise Asterisk answers the
;    sender 404 Not Found (no destination). That is how "unknown extension"
;    fails immediately.
;  - Matching messages are answered 202 Accepted *before* this dialplan runs,
;    so the sender cannot learn about a later delivery failure from the SIP
;    response. When the target has no registered contact (or MessageSend
;    fails) we send the sender a delivery report: a MESSAGE carrying
;    "X-Sipkit-Delivery: failed;id=<X-Sipkit-Message-Id of the original>". The
;    softphone marks that message failed and does not show the report as chat.
[messages]
exten => _[12]XXX,1,NoOp(MESSAGE ${MESSAGE(from)} -> ${EXTEN})
 same => n,Set(SENDER=${CUT(CUT(MESSAGE(from),@,1),:,2)})
 same => n,Set(MSGID=${MESSAGE_DATA(X-Sipkit-Message-Id)})
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${EXTEN})}" = ""]?undeliverable)
 same => n,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,NoOp(MessageSend status: ${MESSAGE_SEND_STATUS})
 same => n,GotoIf($["${MESSAGE_SEND_STATUS}" = "SUCCESS"]?done)
 same => n(undeliverable),NoOp(${EXTEN} is not reachable, reporting failure to ${SENDER})
 same => n,GotoIf($["${SENDER}" = ""]?done)
 same => n,Set(MESSAGE(body)=Message to ${EXTEN} could not be delivered)
 same => n,Set(MESSAGE_DATA(X-Sipkit-Delivery)=failed\;to=${EXTEN}\;id=${MSGID})
 same => n,MessageSend(pjsip:${SENDER},<sip:${EXTEN}@${CUT(CUT(MESSAGE(from),@,2),>,1)}>)
 same => n(done),Hangup()

; ---------------------------------------------------------------- push for incoming calls (V2-PUSH-01)
; docs/push.md. Needs the push service (services/push) and two container env vars:
;   SIPKIT_PUSH_URL     base URL of the push service as Asterisk reaches it, e.g. http://sipkit-push:8790
;                    (empty = push off: the routes behave exactly as before)
;   SIPKIT_PUSH_SECRET  = PUSH_NOTIFY_SECRET of the service (sent as X-Sipkit-Push-Secret)
;   SIPKIT_PUSH_WAIT    seconds to keep the caller ringing while the agent opens the tab (default 30)
;
; Gosub(sipkit-push,start,1(<ext>)) sets PUSH_RESULT:
;   off         no push service configured
;   registered  the extension has (or now has) a registered contact: Dial it
;   timeout     nobody came online within SIPKIT_PUSH_WAIT seconds (Dial then fails: unavailable)
;   declined    the agent pressed Decline on the notification
; The notify request runs on a separate Local channel (Originate ... a = async), so a slow
; or dead push service never delays the call. The caller hears ringing (180) while we wait.
[sipkit-push]
exten => start,1,NoOp(Push wake-up check for ${ARG1})
 same => n,Set(PUSH_RESULT=off)
 same => n,GotoIf($["${ENV(SIPKIT_PUSH_URL)}" = ""]?done)
 same => n,Set(PUSH_RESULT=registered)
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${ARG1})}" != ""]?done)
 same => n,Set(PUSH_ID=${UNIQUEID})
 same => n,Set(DB(SIPKITPUSH/${PUSH_ID}/ext)=${ARG1})
 same => n,Set(DB(SIPKITPUSH/${PUSH_ID}/num)=${CALLERID(num)})
 same => n,Set(DB(SIPKITPUSH/${PUSH_ID}/name)=${CALLERID(name)})
 same => n,Originate(Local/${PUSH_ID}@sipkit-push-notify/n,app,Wait,1,10,a)
 ; CURLOPT headers accumulate per channel: set them once, before the hangup handler uses them.
 same => n,Set(CURLOPT(conntimeout)=1)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(CURLOPT(httpheader)=X-Sipkit-Push-Secret: ${ENV(SIPKIT_PUSH_SECRET)})
 same => n,Set(CHANNEL(hangup_handler_push)=sipkit-push,cancel,1(${ARG1},${PUSH_ID}))
 same => n,Ringing()
 same => n,Set(PUSH_WAIT=${IF($["${ENV(SIPKIT_PUSH_WAIT)}" = ""]?30:${ENV(SIPKIT_PUSH_WAIT)})})
 same => n,Set(PUSH_WAITED=0)
 same => n(wait),GotoIf($["${PJSIP_DIAL_CONTACTS(${ARG1})}" != ""]?online)
 same => n,GotoIf($[${PUSH_WAITED} >= ${PUSH_WAIT}]?timeout)
 same => n,Wait(1)
 same => n,Set(PUSH_WAITED=$[${PUSH_WAITED} + 1])
 same => n,GotoIf($[${PUSH_WAITED} % 2 = 1]?wait)
 same => n,Set(PUSH_STATUS=${CURL(${ENV(SIPKIT_PUSH_URL)}/calls/${PUSH_ID}/status)})
 same => n,GotoIf($["${PUSH_STATUS}" = "declined"]?declined:wait)
 same => n(online),NoOp(${ARG1} registered after ${PUSH_WAITED}s)
 same => n,Goto(done)
 same => n(timeout),Set(PUSH_RESULT=timeout)
 same => n,Goto(done)
 same => n(declined),Set(PUSH_RESULT=declined)
 same => n(done),Return()

; Hangup handler of the caller's channel: tell the service the call is over, so the
; notification disappears (answered, caller hung up, or not answered in time).
; (X-Sipkit-Push-Secret and the timeouts were set on this channel by start.)
exten => cancel,1,NoOp(Push cancel ${ARG2} for ${ARG1})
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/x-www-form-urlencoded)
 same => n,Set(PUSH_CANCEL=${CURL(${ENV(SIPKIT_PUSH_URL)}/notify/cancel,extension=${URIENCODE(${ARG1})}&callId=${URIENCODE(${ARG2})}&reason=${URIENCODE(${DIALSTATUS})})})
 same => n,Return()

; Runs on its own Local channel (never answered): POST /notify/incoming, then hang up.
[sipkit-push-notify]
exten => _X.,1,NoOp(Push notify for call ${EXTEN})
 same => n,Set(PUSH_ID=${EXTEN})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(CURLOPT(httpheader)=X-Sipkit-Push-Secret: ${ENV(SIPKIT_PUSH_SECRET)})
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/x-www-form-urlencoded)
 same => n,Set(PUSH_RESPONSE=${CURL(${ENV(SIPKIT_PUSH_URL)}/notify/incoming,extension=${URIENCODE(${DB(SIPKITPUSH/${PUSH_ID}/ext)})}&callId=${URIENCODE(${PUSH_ID})}&callerId=${URIENCODE(${DB(SIPKITPUSH/${PUSH_ID}/num)})}&callerName=${URIENCODE(${DB(SIPKITPUSH/${PUSH_ID}/name)})})})
 same => n,NoOp(Push service answered: ${PUSH_RESPONSE})
 same => n,DBdeltree(SIPKITPUSH/${PUSH_ID})
 same => n,Hangup()

; Pre-dial handler on the agent's leg: X-Sipkit-Push-Id lets the softphone match the
; INVITE to the notification the agent clicked (and answer it automatically).
[sipkit-push-header]
exten => s,1,Set(PJSIP_HEADER(add,X-Sipkit-Push-Id)=${ARG1})
 ; Reload-safe calls (docs/resume.md): tell the agent which anchor room this call lives in.
 same => n,ExecIf($["${SIPKIT_ANCHOR_IN}" != ""]?Set(PJSIP_HEADER(add,X-Sipkit-Anchor)=${SIPKIT_ANCHOR_IN}))
 same => n,Return()

; ---------------------------------------------------------------- reload-safe calls (V2-RESUME-01)
; docs/resume.md. A softphone with resume.enabled opts in:
;   incoming: its REGISTER Contact carries ;sipkit-resume=<rejoin timeout s>
;   outgoing: its INVITE carries X-Sipkit-Anchor: <digits> (+ X-Sipkit-Anchor-Timeout: <s>)
; Gosub(sipkit-anchor,setup,1(<called ext>)) then sets ANCHOR_OPTS to a Dial G() option that,
; once answered, sends both legs into ConfBridge sipkit-<id> instead of a direct bridge.
; The customer stays in that room when the agent's leg drops (reload), hears music on
; hold while alone, and goes to the agent's voicemail (then hangs up) when no agent leg
; came back within the timeout. A customer hangup ends the agent's leg (BYE).
[sipkit-anchor]
exten => setup,1,Set(ANCHOR_OPTS=)
 same => n,Set(OUT=${FILTER(0-9,${PJSIP_HEADER(read,X-Sipkit-Anchor)})})
 same => n,GotoIf($[${LEN(${OUT})} >= 6]?out)
 same => n,Set(CONTACTS=${PJSIP_DIAL_CONTACTS(${ARG1})})
 same => n,GotoIf($["${CONTACTS}" = ""]?done)
 same => n,Set(MARK=${STRREPLACE(CONTACTS,sipkit-resume=,~)})
 same => n,GotoIf($["${MARK}" = "${CONTACTS}"]?done)
 same => n,Set(T=${CUT(MARK,~,2)})
 same => n,Set(T=${CUT(T,\;,1)})
 same => n,Set(T=${CUT(T,>,1)})
 same => n,Set(ID=${CUT(UNIQUEID,.,1)}${CUT(UNIQUEID,.,2)})
 same => n,Set(DB(ANCHOR/${ID}/agent)=${ARG1})
 same => n,Gosub(timeout,1(${ID},${T}))
 same => n,Set(__SIPKIT_ANCHOR_IN=${ID})
 same => n,Set(ANCHOR_OPTS=G(sipkit-anchor-in^${ID}^1))
 same => n,Goto(done)
 same => n(out),Set(DB(ANCHOR/${OUT}/agent)=${CHANNEL(endpoint)})
 same => n,Gosub(timeout,1(${OUT},${PJSIP_HEADER(read,X-Sipkit-Anchor-Timeout)}))
 same => n,Set(ANCHOR_OPTS=G(sipkit-anchor-out^${OUT}^1))
 same => n(done),Return()

; Rejoin timeout in seconds: 5..300, default 30.
exten => timeout,1,Set(T=${FILTER(0-9,${ARG2})})
 same => n,ExecIf($["${T}" = ""]?Set(T=30))
 same => n,ExecIf($[${T} < 5]?Set(T=5))
 same => n,ExecIf($[${T} > 300]?Set(T=300))
 same => n,Set(DB(ANCHOR/${ARG1}/timeout)=${T})
 same => n,Return()

; Dial G(): the caller continues at priority 1, the called party at priority 2.
[sipkit-anchor-in]
exten => _X.,1,Goto(sipkit-anchor-party,${EXTEN},1)
 same => n,Goto(sipkit-anchor-agent,${EXTEN},1)

[sipkit-anchor-out]
exten => _X.,1,Goto(sipkit-anchor-agent,${EXTEN},1)
 same => n,Goto(sipkit-anchor-party,${EXTEN},1)

[sipkit-anchor-agent]
exten => _X.,1,NoOp(Agent ${CHANNEL(endpoint)} joins anchor ${EXTEN})
 same => n,Set(DB(ANCHOR/${EXTEN}/agentchan)=${CHANNEL(name)})
 ; Inbound legs (outgoing call, *85 rejoin): the WebSocket's ip:port. Outbound legs
 ; (answered incoming call): the URI of the contact the call was sent to.
 same => n,Set(KEY=${CHANNEL(pjsip,remote_addr)})
 same => n,ExecIf($["${KEY}" = "" & "${CHANNEL(contact)}" != ""]?Set(KEY=${PJSIP_CONTACT(${CHANNEL(contact)},uri)}))
 same => n,Set(DB(ANCHOR/${EXTEN}/agentaddr)=${KEY})
 ; Watch this leg: Asterisk keeps a call up when the browser's WebSocket closes, so
 ; [sipkit-anchor-watch] hangs the leg up as soon as its contact is gone (page unloaded).
 same => n,Originate(Local/${EXTEN}@sipkit-anchor-watch/n,app,Wait,86400,5,a)
 same => n,ConfBridge(sipkit-${EXTEN},sipkit_bridge,sipkit_anchor_agent)
 same => n,Hangup()

; One watcher per agent leg (a Local channel that answers itself and polls every second).
; The leg's WebSocket address (ip:port) disappears from the endpoint's contacts the moment
; the browser's WebSocket closes (registrar transport monitor): then the leg is dead and is
; hung up, so the customer leaves the room and the rejoin timeout starts. A newer leg (rejoin)
; or the end of the anchor stops the watcher.
[sipkit-anchor-watch]
exten => _X.,1,Answer()
 same => n,Set(ID=${EXTEN})
 same => n,Set(CHAN=${DB(ANCHOR/${ID}/agentchan)})
 same => n,Set(ADDR=${DB(ANCHOR/${ID}/agentaddr)})
 same => n,Set(AGENT=${DB(ANCHOR/${ID}/agent)})
 same => n,GotoIf($["${CHAN}" = "" | "${ADDR}" = ""]?done)
 same => n(loop),Wait(1)
 same => n,GotoIf($["${DB(ANCHOR/${ID}/agentchan)}" != "${CHAN}"]?done)
 same => n,Set(CONTACTS=${PJSIP_DIAL_CONTACTS(${AGENT})})
 same => n,GotoIf($["${STRREPLACE(CONTACTS,${ADDR},~)}" != "${CONTACTS}"]?loop)
 same => n,NoOp(Agent leg ${CHAN} lost its contact ${ADDR}: hanging it up)
 same => n,SoftHangup(${CHAN})
 same => n(done),Hangup()

[sipkit-anchor-party]
exten => _X.,1,NoOp(Customer ${CALLERID(num)} anchored in ${EXTEN})
 same => n,Set(ID=${EXTEN})
 same => n,Set(ROOM=sipkit-${ID})
 same => n,Set(DB(ANCHOR/${ID}/party)=${CHANNEL(name)})
 same => n,Set(CHANNEL(hangup_handler_push)=sipkit-anchor-hangup,s,1(${ID}))
 same => n,Set(TIMEOUT_S=${DB(ANCHOR/${ID}/timeout)})
 same => n,ExecIf($["${TIMEOUT_S}" = ""]?Set(TIMEOUT_S=30))
 same => n(join),ConfBridge(${ROOM},sipkit_bridge,sipkit_anchor_party)
 ; Out of the room: the agent's last leg is gone (end_marked), or the call was ended.
 same => n,Wait(0.6)
 same => n,GotoIf($["${DB(ANCHOR/${ID}/ended)}" = "1"]?bye)
 same => n,NoOp(Agent left anchor ${ID}: waiting up to ${TIMEOUT_S}s for a rejoin)
 same => n,Set(WAITED=0)
 same => n,StartMusicOnHold(default)
 same => n(wait),GotoIf($["${DB(ANCHOR/${ID}/ended)}" = "1"]?bye)
 same => n,GotoIf($[0${CONFBRIDGE_INFO(parties,${ROOM})} > 0]?back)
 same => n,GotoIf($[${WAITED} >= ${TIMEOUT_S} * 2]?fallback)
 same => n,Wait(0.5)
 same => n,Set(WAITED=$[${WAITED} + 1])
 same => n,Goto(wait)
 same => n(back),StopMusicOnHold()
 same => n,NoOp(Agent is back in anchor ${ID})
 same => n,Goto(join)
 same => n(fallback),StopMusicOnHold()
 same => n,NoOp(No agent came back to anchor ${ID}: fallback)
 same => n,Set(DB(ANCHOR/${ID}/ended)=1)
 same => n,Set(MAILBOX=${DB(ANCHOR/${ID}/agent)})
 same => n,ExecIf($[${VM_INFO(${MAILBOX}@default,exists)}]?VoiceMail(${MAILBOX}@default,u))
 same => n(bye),Hangup()

; The agent hung up for real (*86): end the customer's leg too.
[sipkit-anchor-bye]
exten => s,1,Hangup()

; Hangup handler of the customer's channel: end the agent's (latest) leg and forget the anchor.
[sipkit-anchor-hangup]
exten => s,1,NoOp(Anchor ${ARG1} closed)
 same => n,Set(AGENTCHAN=${DB(ANCHOR/${ARG1}/agentchan)})
 same => n,DBdeltree(ANCHOR/${ARG1})
 same => n,ExecIf($["${AGENTCHAN}" != ""]?SoftHangup(${AGENTCHAN}))
 same => n,Return()
