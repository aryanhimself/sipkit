; ConfBridge profiles for server-side conferences (V2-CONF-01, config conference.mode 'server').
; Rooms are entered through extensions.conf _7XXXX.

[general]

[sipkit_bridge]
type=bridge
max_members=20
mixing_interval=20
internal_sample_rate=auto

; The softphone user who built the conference (X-Sipkit-Conference: owner).
[sipkit_owner]
type=user
admin=yes
marked=yes
quiet=yes
announce_user_count=no
announce_only_user=no
dsp_drop_silence=yes

; Parties the owner transferred in. Stay after the owner leaves.
[sipkit_party]
type=user
quiet=yes
announce_only_user=no
music_on_hold_when_empty=yes
dsp_drop_silence=yes

; Parties of a room whose owner asked for end-on-leave (X-Sipkit-Conference-End: yes).
[sipkit_party_end]
type=user
quiet=yes
announce_only_user=no
music_on_hold_when_empty=yes
dsp_drop_silence=yes
end_marked=yes

; Owner DTMF menu (send the digits as DTMF on the room call).
[sipkit_owner_menu]
type=menu
*1=toggle_mute
*2=admin_kick_last
*3=admin_toggle_mute_participants
*4=admin_toggle_conference_lock

; ---------------------------------------------------------------- reload-safe calls (V2-RESUME-01)
; Anchor rooms sipkit-<id>: one per answered call of a softphone with resume.enabled
; (docs/resume.md). The agent's leg can drop (page reload) and rejoin with *85<id>;
; the customer stays in the room and hears music on hold while alone.
[sipkit_anchor_agent]
type=user
marked=yes
quiet=yes
announce_user_count=no
announce_only_user=no

; The customer: leaves the room (to the wait loop in [sipkit-anchor-party]) when the
; last agent leg is gone, so the dialplan can run the rejoin timeout and fallback.
[sipkit_anchor_party]
type=user
quiet=yes
announce_only_user=no
announce_user_count=no
music_on_hold_when_empty=yes
end_marked=yes
