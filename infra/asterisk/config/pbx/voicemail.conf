; Dev PBX voicemail (app_voicemail, file storage in /var/spool/asterisk/voicemail).
; Mailbox password = extension number. MWI reaches the softphone through the
; PJSIP "mailboxes" option (see pjsip.conf.tmpl). Dial plan: extensions.conf.
[general]
format=wav49|wav
serveremail=asterisk@sipkit-dev-pbx
attach=no
maxmsg=100
maxsecs=120
; Keep even very short messages (e2e tests record a few seconds of fake audio).
minsecs=0
maxsilence=0
skipms=3000
maxlogins=3
; Pick up mailbox changes made outside app_voicemail (the *99XXXX purge
; extension deletes spool files) and publish MWI for them within ~2 s.
pollmailboxes=yes
pollfreq=2

[default]
1001 => 1001,Agent 1001
1002 => 1002,Agent 1002
2001 => 2001,Desk 2001
2002 => 2002,Desk 2002
