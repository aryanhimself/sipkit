[general]
persistentmembers=no
shared_lastcall=yes

; Dial 700. Rings both WebRTC agents; caller hears music on hold meanwhile.
[support]
strategy=ringall
timeout=15
retry=5
wrapuptime=5
musicclass=default
announce-frequency=0
joinempty=yes
leavewhenempty=no
ringinuse=no
member => PJSIP/1001,0,Agent 1001
member => PJSIP/1002,0,Agent 1002
