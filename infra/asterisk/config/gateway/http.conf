; HTTP server - hosts the SIP-over-WebSocket endpoint (RFC 7118) at /ws.
; Browsers require WSS for WebRTC, so only the TLS listener is exposed.
[general]
enabled=yes
; Plain HTTP stays on loopback inside the container (used by nothing external).
bindaddr=127.0.0.1
bindport=8088
; TLS listener: wss://<host>:8089/ws
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/server.crt
tlsprivatekey=/etc/asterisk/keys/server.key
; GET https://localhost:8089/httpstatus is a handy page to accept the dev cert.
enable_status=yes
servername=sipkit-dev-gateway
