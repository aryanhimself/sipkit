# coturn TURN/STUN server - DEV configuration.
# Browser ICE config example (softphone `iceServers`):
#   { urls: ['turn:127.0.0.1:3478?transport=udp', 'turn:127.0.0.1:3478?transport=tcp'],
#     username: 'sipkit', credential: '<TURN_PASSWORD from .env>' }
# external-ip, user and realm are passed on the command line from docker-compose.yml.

listening-port=3478
listening-ip=0.0.0.0
# Keep in sync with the ports published in docker-compose.yml.
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
log-file=stdout
simple-log

# DEV ONLY: relaying to private ranges is allowed so the relay can reach Asterisk
# on the Docker network. In production deny private peers except your media
# servers (denied-peer-ip / allowed-peer-ip) and use `use-auth-secret` with
# short-lived credentials instead of a static user.
